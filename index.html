<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Log Viewer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lock-screen" class="lock-screen">
  <form id="unlock-form" class="lock-card" autocomplete="off">
    <div class="lock-icon">&#128274;</div>
    <h1>Log Viewer</h1>
    <p class="lock-sub">Enter password to decrypt the database</p>
    <input type="password" id="password-input" placeholder="Password" autofocus
           aria-label="Password" spellcheck="false">
    <div id="lock-error" class="lock-error" hidden>Wrong password</div>
    <button type="submit" id="unlock-btn">Unlock</button>
    <div id="lock-status" class="lock-status"></div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">&#128214;</span>
      <div>
        <div class="title">Log Viewer</div>
        <div class="subtitle" id="db-meta">&nbsp;</div>
      </div>
    </div>
    <button id="lock-btn" class="btn-ghost" title="Clear data and lock">&#128274; Lock</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="entries">Entries</button>
    <button class="tab" data-tab="reports">Reports</button>
    <button class="tab" data-tab="stats">Stats</button>
  </nav>

  <!-- ---------- ENTRIES ---------- -->
  <section id="panel-entries" class="panel">
    <div class="controls">
      <input type="search" id="search-input" placeholder="Search (literal match)…"
             autocomplete="off" spellcheck="false" aria-label="Search">
      <div class="filter-row">
        <div class="chip-group" id="type-chips" data-label="type">
          <span class="chip-label">Type</span>
          <button class="chip" data-value="LOG">LOG</button>
          <button class="chip" data-value="TODO">TODO</button>
          <button class="chip" data-value="TASK">TASK</button>
        </div>
        <div class="chip-group" id="status-chips" data-label="status">
          <span class="chip-label">Status</span>
          <button class="chip" data-value="LOG">LOG</button>
          <button class="chip" data-value="PENDING">PENDING</button>
          <button class="chip" data-value="ONGOING">ONGOING</button>
          <button class="chip" data-value="COMPLETED">COMPLETED</button>
        </div>
        <select id="month-select" aria-label="Month"><option value="">All months</option></select>
        <select id="followup-select" aria-label="Follow up"><option value="">Any follow-up</option></select>
        <button id="sort-btn" class="btn-ghost" title="Toggle sort order">&#8595; newest</button>
        <button id="clear-btn" class="btn-ghost" title="Clear all filters">Clear</button>
      </div>
    </div>

    <div id="result-count" class="result-count"></div>
    <div id="entries-list" class="entries"></div>
    <div class="load-more-wrap">
      <button id="load-more" class="btn-ghost" hidden>Load more</button>
    </div>
  </section>

  <!-- ---------- REPORTS ---------- -->
  <section id="panel-reports" class="panel" hidden>
    <div class="controls">
      <select id="report-type-select" aria-label="Report type">
        <option value="">All report types</option>
      </select>
    </div>
    <div id="reports-list" class="reports"></div>
  </section>

  <!-- ---------- STATS ---------- -->
  <section id="panel-stats" class="panel" hidden>
    <div id="stats-content" class="stats"></div>
  </section>

  <footer class="foot">Decrypted in your browser only &middot; nothing is uploaded</footer>
</div>

<!-- ============ ENTRY MODAL ============ -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-bar">
      <span>Entry detail</span>
      <button id="modal-close" class="btn-ghost">Close</button>
    </div>
    <div id="modal-body" class="modal-body entries"></div>
  </div>
</div>

<script src="vendor/sql-wasm.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="js/crypto.js"></script>
<script src="js/app.js"></script>
</body>
</html>
